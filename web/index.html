<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<title>Project Earning</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}
.card{background:#1e1e1e;padding:16px;border-radius:15px;margin-bottom:12px;border:1px solid #333}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#00ff88,#00ccff);border:none;border-radius:10px;font-weight:bold;color:#000;font-size:16px;margin-top:8px;cursor:pointer}
.btn:disabled{opacity:0.5}
.task{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:12px;border-radius:10px;margin:8px 0}
.task button{padding:8px 12px;border-radius:8px;border:none;background:#00ff88;font-weight:bold}
input,select{width:94%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#333;color:#fff}
</style>
</head>
<body>
<div class="card">
<h2>💰 Project Earning</h2>
<p>💵 Balance: <b id="bal">0</b>৳ | Ads: <b id="adsCount">0/10</b></p>
<p>👥 Refs: <b id="refs">0</b> | 🌍 Total: <b id="total">0</b></p>
<p style="font-size:11px;background:#000;padding:8px;border-radius:8px;word-break:break-all" id="reflink"></p>
</div>
<div class="card">
<h3>📋 Bonus Tasks</h3>
<div class="task"><span>📢 Main Channel</span><button onclick="openTask('https://t.me/ProjectEarnig','main')">Join +10৳</button></div>
<div class="task"><span>✅ Payment Proof</span><button onclick="openTask('https://t.me/Projectpayments','payment')">Join +10৳</button></div>
<div class="task"><span>👍 Facebook Page</span><button onclick="openTask('https://www.facebook.com/share/19gncw1dwC/','fb')">Like +10৳</button></div>
<div class="task"><span>▶️ YouTube @NHMMunna</span><button onclick="openTask('https://www.youtube.com/@NHMMunna','yt')">Sub +10৳</button></div>
</div>
<div class="card">
<h3>📺 Daily Ads - 7৳ per Ad</h3>
<p>প্রতিদিন 10টা এড দেখতে পারবে</p>
<button class="btn" onclick="showAd()" id="adBtn">Watch Ad - 7৳</button>
</div>
<div class="card">
<h3>💸 Withdraw - Min 230৳</h3>
<select id="method"><option>Bkash</option><option>Nagad</option><option>Rocket</option></select>
<input id="wallet" placeholder="Bkash/Nagad Number">
<input id="amount" type="number" placeholder="Min 230">
<button class="btn" onclick="doWithdraw()">Withdraw Request</button>
</div>
<script>
const tg = window.Telegram.WebApp; tg.expand();
const uid = tg.initDataUnsafe?.user?.id || "8630373069";
// BOT API - Railway Link (Bot চলবে Railway তে)
const BOT_API = "https://project-earning-bot-production.up.railway.app";

document.getElementById('reflink').innerText = `Ref: https://t.me/ProjectEarningBot?start=${uid}`;
const RewardAd = window.Adsgram.init({ blockId: "51197" });
const InterAd = window.Adsgram.init({ blockId: "int-51198" });

async function loadData(){
  try{
    let r = await fetch(`${BOT_API}/api/balance?user_id=${uid}`).then(x=>x.json());
    document.getElementById('bal').innerText = r.bal;
    document.getElementById('refs').innerText = r.refs;
    document.getElementById('total').innerText = r.total;
    document.getElementById('adsCount').innerText = (r.ads_today || 0) + "/10";
  }catch(e){ console.log("API Error", e) }
}
loadData();

function openTask(link, type){
  window.open(link, '_blank');
  fetch(`${BOT_API}/api/task`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid, task:type})})
  .then(r=>r.json()).then(d=>{ if(d.ok){alert("✅ +10৳ Added!"); loadData();} else alert(d.msg); });
}

let adCount = 0;
async function showAd(){
  const btn=document.getElementById('adBtn'); btn.innerText="Loading..."; btn.disabled=true;
  try{
    let res = await RewardAd.show();
    if(res.done){
      let add = await fetch(`${BOT_API}/api/add_balance`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid, amount:7, type:"ad"})}).then(x=>x.json());
      if(add.ok){ alert(`✅ 7৳ Added! Today: ${add.ads_today}/10`); loadData(); }
      else alert(add.msg);
    }
  }catch(e){ alert("Ad Failed, আবার চেষ্টা করো"); }
  btn.innerText="Watch Ad - 7৳"; btn.disabled=false;
  if(++adCount % 2 == 0){ try{ await InterAd.show(); }catch(e){} }
}

async function doWithdraw(){
  let m=document.getElementById('method').value, w=document.getElementById('wallet').value, a=document.getElementById('amount').value;
  if(!w||!a){ alert("Number & Amount দাও"); return; }
  if(parseInt(a) < 230){ alert("Minimum 230৳"); return; }
  let res=await fetch(`${BOT_API}/api/withdraw`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:String(uid),amount:a,method:m,wallet:w})}).then(x=>x.json());
  alert(res.ok?"✅ Request Admin এর কাছে গেছে! 24H এর মধ্যে পেমেন্ট পাবে":"❌ "+res.msg);
  if(res.ok) loadData();
}
</script>
</body>
  </html>
