<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<title>Project Earning</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}
.card{background:#1e1e1e;padding:16px;border-radius:15px;margin-bottom:12px;border:1px solid #333}
.btn{width:100%;padding:13px;background:linear-gradient(90deg,#00ff88,#00ccff);border:none;border-radius:10px;font-weight:bold;color:#000;font-size:16px;margin-top:8px}
.task{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;padding:12px;border-radius:10px;margin:8px 0}
.task b{color:#00ff88}
input,select{width:94%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#333;color:#fff;box-sizing:border-box}
</style>
</head>
<body>
<div class="card">
<h2>💰 Project Earning</h2>
<p>💵 Balance: <b id="bal">0</b>৳</p>
<p>👥 Refs: <b id="refs">0</b> | 🌍 Total: <b id="total">0</b></p>
<p style="font-size:11px;background:#000;padding:8px;border-radius:8px;word-break:break-all" id="reflink"></p>
</div>

<div class="card">
<h3>📋 Tasks - 70৳</h3>
<div class="task"><span>📢 Telegram Channel</span><b>20৳</b></div>
<div class="task"><span>👍 Facebook Page</span><b>20৳</b></div>
<div class="task"><span>▶️ YouTube Subscribe</span><b>15৳</b></div>
<div class="task"><span>📺 Adsgram Ad - 15৳</span> <button onclick="showAd()" id="adBtn" style="background:#00ff88;border:none;padding:6px 12px;border-radius:8px;font-weight:bold">Watch</button></div>
</div>

<div class="card">
<h3>💸 Withdraw - Min 230৳</h3>
<select id="method"><option>Bkash</option><option>Nagad</option><option>Rocket</option></select>
<input id="wallet" placeholder="Bkash/Nagad/Rocket Number">
<input id="amount" type="number" placeholder="Min 230">
<button class="btn" onclick="doWithdraw()">Withdraw</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
const uid = tg.initDataUnsafe?.user?.id || "8630373069";
document.getElementById('reflink').innerText = `Ref Link: https://t.me/YourBot?start=${uid}`;

// তোমার 2 টা Block ID
const RewardAd = window.Adsgram.init({ blockId: "51197" });
const InterAd = window.Adsgram.init({ blockId: "int-51198" });

let adCount = 0;

async function showAd(){
  const btn = document.getElementById('adBtn');
  btn.innerText = "Loading...";
  try{
    const result = await RewardAd.show();
    if(result.done){
      alert('✅ Ad দেখা শেষ! 15৳ পেয়েছো!');
      // Balance Add API
      await fetch(`https://project-earning-bot-web.vercel.app/api/reward?userId=[userId]&actualId=${uid}`.replace('[userId]', uid));
      // যদি তোমার bot এ /api/add-balance থাকে তাহলে নিচেরটা ব্যবহার করো
      // fetch(`/api/add-balance?user_id=${uid}&amount=15`)
      location.reload();
    }
  }catch(e){
    alert('❌ Ad দেখা হয়নি: ' + JSON.stringify(e));
  }
  btn.innerText = "Watch";
  adCount++;
  // প্রতি 2 টা Reward Ad এর পর 1 টা Inter Ad
  if(adCount % 2 == 0){
    try{ await InterAd.show(); }catch(e){}
  }
}

async function doWithdraw(){
  let m=document.getElementById('method').value;
  let w=document.getElementById('wallet').value;
  let a=document.getElementById('amount').value;
  if(!w ||!a){ alert("Number & Amount দাও"); return; }
  let res = await fetch('https://project-earning-bot-web.vercel.app/api/withdraw',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:String(uid),amount:a,method:m,wallet:w})
  });
  let d=await res.json();
  alert(d.ok?"✅ Admin এর কাছে গেছে!":"❌ "+d.msg);
}

// Balance Load
fetch(`https://project-earning-bot-web.vercel.app/api/user?user_id=${uid}`).then(r=>r.json()).then(d=>{
  if(d.ok){
    document.getElementById('bal').innerText = d.balance || 0;
    document.getElementById('refs').innerText = d.refs || 0;
  }
}).catch(()=>{});
</script>
</body>
</html>
